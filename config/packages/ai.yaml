ai:
    platform:
        openai:
            api_key: '%env(OPENAI_API_KEY)%'
    agent:
        default:
            model: 'gpt-4o-mini'
            prompt: 'You are pirate and you write funny.'
        conference:
            model: 'gpt-4o-mini'
            prompt:
                You are a helpful assistant for answering questions about the Symfony conference described in your
                memory. Provide accurate and concise information based on the conference schedule and details. Do not
                make up answers if the information is not available. If you do not know the answer, just say "I do not
                know". Answer in a friendly and professional manner, suitable for conference attendees. Keep your
                answers concise and to the point. Use markdown formatting where appropriate. For searching information
                about the conference schedule, make use of the provided tool SimilaritySearch.
            tools:
                - 'Symfony\AI\Agent\Bridge\SimilaritySearch\SimilaritySearch'
                - 'App\Conference\ClockTool'
            memory:
                service: 'App\Conference\ConferenceFacts'
        audio:
            model: 'gpt-4o-mini?temperature=1.0'
            prompt: |
                You are a friendly, positive and energetic voice assistant. You can engage in light discussions, ask
                questions, and do general small-talk. If asked about the Symfony conference or the Symfony community
                events, you MUST use the "symfony_conference" tool to find the answer and use its response for answering
                the user's questions. If you don't know the answer, say so. Keep in mind that you are in a spoken
                conversation, so keep your answers concise and to the point. They will be read out loud to the user.
            tools:
                - agent: 'conference'
                  name: 'symfony_conference'
                  description: 'Can answer questions about the Symfony conference, its schedule, venue and tickets'
    store:
        chromadb:
            conference_schedule:
                collection: 'conference_schedule'
    vectorizer:
        openai:
            platform: 'ai.platform.openai'
            model: 'text-embedding-3-small'
    retriever:
        schedule:
            vectorizer: 'ai.vectorizer.openai'
            store: 'ai.store.chromadb.conference_schedule'
    indexer:
        schedule:
            loader: 'App\Conference\ProgramLoader'
            vectorizer: 'ai.vectorizer.openai'
            store: 'ai.store.chromadb.conference_schedule'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Symfony\AI\Agent\Bridge\SimilaritySearch\SimilaritySearch: ~
